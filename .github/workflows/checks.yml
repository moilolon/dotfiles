name: Run the checks

# On the real thing: Git Bash on Windows, the shell this prompt is for. ShellCheck on every
# script, then test/install.sh installs, loads and uninstalls the prompt in a throwaway HOME.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: |
          python -m pip install --quiet shellcheck-py==0.11.0.1
          shellcheck --version | head -2
          shellcheck -x install.sh uninstall.sh bash/bashrc bash/prompt.sh test/install.sh

      - name: Install, load and uninstall
        run: bash test/install.sh
